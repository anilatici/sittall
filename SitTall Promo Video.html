    // ── Animation framework (inlined) ──────────────────────────────────────────
    const TimeContext = React.createContext(0);
    function useTime() { return React.useContext(TimeContext); }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    const Easing = {
      easeOutCubic: (t) => 1 - Math.pow(1 - t, 3),
      easeInOutCubic: (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    };

    function Stage({ width, height, duration, background, persistKey, loop, children }) {
      const [time, setTime] = React.useState(0);
      const [playing, setPlaying] = React.useState(false);
      const rafRef = React.useRef(null);
      const lastRef = React.useRef(null);

      React.useEffect(() => {
        if (persistKey) {
          const saved = sessionStorage.getItem(persistKey);
          if (saved != null) setTime(parseFloat(saved));
        }
      }, []);

      React.useEffect(() => {
        if (persistKey) sessionStorage.setItem(persistKey, time.toString());
      }, [time, persistKey]);

      React.useEffect(() => {
        if (!playing) {
          lastRef.current = null;
          if (rafRef.current) cancelAnimationFrame(rafRef.current);
          return;
        }
        const tick = (ts) => {
          if (lastRef.current != null) {
            const dt = (ts - lastRef.current) / 1000;
            setTime((prev) => {
              const next = prev + dt;
              if (next >= duration) {
                if (loop) return 0;
                setPlaying(false);
                return duration;
              }
              return next;
            });
          }
          lastRef.current = ts;
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
        return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
      }, [playing, duration, loop]);

      const pct = duration > 0 ? (time / duration) * 100 : 0;
      const fmt = (s) => {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        const ms = Math.floor((s % 1) * 10);
        return `${m}:${sec.toString().padStart(2, '0')}.${ms}`;
      };

      const handleScrub = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        setTime(clamp(x, 0, 1) * duration);
      };

      const handleKeyDown = React.useCallback((e) => {
        if (e.code === 'Space') { e.preventDefault(); setPlaying((p) => !p); }
        if (e.code === 'ArrowLeft') setTime((t) => clamp(t - 0.5, 0, duration));
        if (e.code === 'ArrowRight') setTime((t) => clamp(t + 0.5, 0, duration));
        if (e.code === 'Home') { setTime(0); setPlaying(false); }
        if (e.code === 'End') { setTime(duration); setPlaying(false); }
      }, [duration]);

      React.useEffect(() => {
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [handleKeyDown]);

      return (
        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', background: '#000' }}>
          <div style={{ flex: 1, position: 'relative', overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{
              width, height, position: 'relative', transformOrigin: 'center center',
              background: background || '#000',
              aspectRatio: `${width}/${height}`,
              maxWidth: '100%', maxHeight: '100%',
            }}>
              <TimeContext.Provider value={time}>
                {children}
              </TimeContext.Provider>
            </div>
          </div>
          <div style={{
            height: 48, background: '#111114', borderTop: '1px solid #222',
            display: 'flex', alignItems: 'center', padding: '0 16px', gap: 14,
            fontFamily: "'JetBrains Mono', monospace", fontSize: 12, color: '#888',
            userSelect: 'none', flexShrink: 0,
          }}>
            <button onClick={() => { if (time >= duration) setTime(0); setPlaying((p) => !p); }} style={{
              background: 'none', border: 'none', color: '#ccc', cursor: 'pointer',
              fontSize: 18, padding: '2px 6px', lineHeight: 1,
            }}>
              {playing ? '\u23F8' : '\u25B6'}
            </button>
            <span style={{ minWidth: 80, textAlign: 'center', color: '#aaa' }}>
              {fmt(time)} / {fmt(duration)}
            </span>
            <div
              onClick={handleScrub}
              onMouseDown={(e) => {
                handleScrub(e);
                const move = (ev) => handleScrub(ev);
                const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
                window.addEventListener('mousemove', move);
                window.addEventListener('mouseup', up);
              }}
              style={{
                flex: 1, height: 6, background: '#2a2a2e', borderRadius: 3,
                cursor: 'pointer', position: 'relative',
              }}
            >
              <div style={{
                width: `${pct}%`, height: '100%', background: '#2dd4bf',
                borderRadius: 3, transition: playing ? 'none' : 'width 0.1s',
              }} />
              <div style={{
                position: 'absolute', top: -5, left: `${pct}%`, transform: 'translateX(-50%)',
                width: 14, height: 14, borderRadius: '50%', background: '#2dd4bf',
                border: '2px solid #111114', boxShadow: '0 0 6px rgba(45,212,191,0.4)',
              }} />
            </div>
            <span style={{ color: '#555', fontSize: 11 }}>1\u00D7</span>
          </div>
        </div>
      );
    }

    const SANS = "'Space Grotesk', sans-serif";
    const MONO = "'JetBrains Mono', monospace";
    const ACCENT = "oklch(0.72 0.16 175)";

    // ── helpers ──────────────────────────────────────────────────────────────────
    const eo = Easing.easeOutCubic;
    const eio = Easing.easeInOutCubic;
    const cl = clamp;
    const ease = (t) => eo(cl(t, 0, 1));

    // Fade a value in starting at `at`, over `dur` seconds
    function fadeIn(t, at, dur = 0.55) {
      return ease((t - at) / dur);
    }

    // ── Grid background ───────────────────────────────────────────────────────────
    function GridBg({ op = 1 }) {
      return (
        <div style={{
          position: 'absolute', inset: 0, pointerEvents: 'none',
          backgroundImage: `
        linear-gradient(rgba(255,255,255,0.042) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.042) 1px, transparent 1px)
      `,
          backgroundSize: '80px 80px',
          opacity: op,
          maskImage: 'radial-gradient(ellipse 110% 80% at 50% 10%, black 20%, transparent 75%)',
          WebkitMaskImage: 'radial-gradient(ellipse 110% 80% at 50% 10%, black 20%, transparent 75%)',
        }} />
      );
    }

    // ── Scene wrapper — handles crossfade in/out ─────────────────────────────────
    function SceneWrap({ start, end, fade = 0.3, children }) {
      const time = useTime();
      if (time < start || time > end) return null;
      const t = time - start;
      const dur = end - start;
      let op = 1;
      if (t < fade) op = ease(t / fade);
      else if (t > dur - fade) op = ease((dur - t) / fade);
      return (
        <div style={{ position: 'absolute', inset: 0, opacity: op, willChange: 'opacity' }}>
          {typeof children === 'function' ? children(t) : children}
        </div>
      );
    }

    // ── Slide-up fade text ────────────────────────────────────────────────────────
    function Appear({ t, at, dy = 22, children, style }) {
      const p = fadeIn(t, at);
      const ty = (1 - p) * dy;
      return (
        <div style={{
          opacity: p,
          transform: `translateY(${ty}px)`,
          willChange: 'opacity, transform',
          ...style,
        }}>
          {children}
        </div>
      );
    }

    // ── Slide-in from left ────────────────────────────────────────────────────────
    function SlideLeft({ t, at, dx = 60, children, style }) {
      const p = fadeIn(t, at);
      const tx = (1 - p) * -dx;
      return (
        <div style={{
          opacity: p,
          transform: `translateX(${tx}px)`,
          willChange: 'opacity, transform',
          ...style,
        }}>
          {children}
        </div>
      );
    }

                    You've been<br />
                    <span style={{ color: ACCENT_AMBER }}>slouching</span><br />
                    for hours.
                  </div>
                </Appear>

                {/* Sub */}
                <Appear t={t} at={2.6} style={{ textAlign: 'center', marginTop: 36 }}>

                    And you didn't even notice.
                  </div>
                </Appear>
              </div>
            );
          }}
        </SceneWrap>
      );
    }

    function Scene2_Drift() {
      return (
        <SceneWrap start={5.7} end={12.2}>
          {(t) => {
            // Angle: 0° → 15° from t=1 to t=4.5
            const rawAngle = t < 1 ? 0 : Math.min(15, (t - 1) * 4.3);
            const angle = rawAngle;
            const alertProg = t > 3.5 ? ease((t - 3.5) / 1.2) : 0;
            const blinkOn = Math.sin(t * 7) > 0;
            const pitch = angle.toFixed(1);

            return (
              <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

                {/* LEFT: data readout */}
                <Appear t={t} at={0.3} style={{ position: 'absolute', left: 160, top: '50%', transform: 'translateY(-50%)' }}>
                  <div style={{ fontFamily: MONO, lineHeight: 1 }}>
                    <div style={{ fontSize: 11, color: TEXT3, letterSpacing: '0.12em', textTransform: 'uppercase', marginBottom: 20 }}>
                      Sensor Data
                    </div>
                    {[
                      ['PITCH', `+${pitch}°`, alertProg > 0.4],
                      ['ROLL', '−0.4°', false],
                      ['YAW', '+0.8°', false],

              </div>
            </div>
            <span style={{ fontFamily: SANS, fontSize: 11, color: TEXT3, flexShrink: 0, marginTop: 2 }}>1m ago</span>
          </div>

          {/* Head */}
      <svg width="240" height="260" viewBox="-110 -120 240 270">
            <line x1="0" y1="-158" x2="0" y2="98" stroke="rgba(255,255,255,0.05)" strokeWidth="1" strokeDasharray="5 5" />
            <HeadSilhouette tiltDeg={headAngle} alertProg={alertProg} />
          </svg>

          {/* Status */}
          <div style={{
            fontFamily: MONO, fontSize: 13, letterSpacing: '0.08em',
            color: corrected ? ACCENT : TEXT3,
            transition: 'color 0.5s',
          }}>
            {corrected ? '✓ Posture corrected' : 'Slouch detected for 5 min'}
          </div>
        </div>
      );
    }

    function Scene5_Steps() {
      return (
        <SceneWrap start={23.1} end={41}>
          {(t) => {
            // 3 steps × 6s each
            const step1T = t;           // 0–6
            const step2T = t - 6;       // 6–12
            const step3T = t - 12;      // 12–18

            // Step progress dots
            const activeStep = t < 6 ? 0 : t < 12 ? 1 : 2;

            return (
              <div style={{ position: 'absolute', inset: 0 }}>
                <GridBg op={0.6} />

                {/* Progress dots */}
                <div style={{
                  position: 'absolute', bottom: 54, left: '50%',
                  transform: 'translateX(-50%)',
                  display: 'flex', gap: 12, alignItems: 'center',
                  opacity: fadeIn(t, 0.3, 0.5),
                }}>
                  {[0, 1, 2].map(i => (
                    <div key={i} style={{
                      width: i === activeStep ? 28 : 8,
                      height: 8, borderRadius: 4,
                      background: i === activeStep ? ACCENT_HEX : 'rgba(255,255,255,0.15)',
                      transition: 'all 0.4s',
                    }} />
                  ))}
                </div>

                {/* Steps (render all, opacity handled inside StepLayout) */}
                {step1T >= 0 && step1T < 6.4 && (
                  <StepLayout t={step1T} stepNum={1} title={"Calibrate\nonce."}
                    body={"Sit tall and tap. Slouch and tap. SitTall - Fix Your Posture learns your personal posture range in two seconds."}>
                    <CalibrationDemo t={step1T} />
                  </StepLayout>
                )}
                {step2T >= 0 && step2T < 6.4 && (
                  <StepLayout t={step2T} stepNum={2} title={"Wear your\nAirPods."}
                    body={"Work normally. Sensors read pitch, roll & yaw 60 times per second — completely silent."}>
                    <SensorHUDDemo t={step2T} />
                  </StepLayout>
                )}
                {step3T >= 0 && step3T < 6.4 && (
                  <StepLayout t={step3T} stepNum={3} title={"Correct\ninstantly."}
                    body={"After sustained bad posture, a gentle nudge arrives. Snooze, or just sit up."}>
                    <NotificationDemo t={step3T} />
                  </StepLayout>
                )}
              </div>
            );
          }}
        </SceneWrap>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // SCENE 6 — PRIVACY  (30.5 – 37s)
    // ═══════════════════════════════════════════════════════════════════════════════
    function Scene6_Privacy() {
      return (
        <SceneWrap start={40.9} end={46.7}>
          {(t) => {
            const zoom = 1 + t * 0.006;
            const lines = [
              { text: 'No camera.', at: 0.4 },
              { text: 'No cloud.', at: 1.4 },
              { text: 'No account.', at: 2.4 },
            ];
            return (
              <div style={{
                position: 'absolute', inset: 0,
                display: 'flex', flexDirection: 'column',
                alignItems: 'center', justifyContent: 'center',
                transform: `scale(${zoom})`,
              }}>
                <Appear t={t} at={0} style={{ marginBottom: 44, textAlign: 'center' }}>
                  <div style={{ fontFamily: MONO, fontSize: 13, color: TEXT3, letterSpacing: '0.14em', textTransform: 'uppercase' }}>
                    Privacy, by design
                  </div>
                </Appear>

                {lines.map(({ text, at }) => {
                  const p = fadeIn(t, at, 0.5);
                  return (
                    <div key={text} style={{
                      opacity: p,
                      transform: `translateX(${(1 - p) * -50}px)`,
                      willChange: 'opacity,transform',
                      fontFamily: SANS, fontSize: 108,
                      fontWeight: 600, letterSpacing: '-0.03em',
                      lineHeight: 1.14, color: TEXT, textAlign: 'center',
                    }}>
                      {text}
                    </div>
                  );
                })}

                <Appear t={t} at={3.6} style={{ textAlign: 'center', marginTop: 32 }}>
                  <div style={{ fontFamily: MONO, fontSize: 15, color: ACCENT, letterSpacing: '0.08em' }}>
                    All processing on your Mac. Always.
                  </div>
                </Appear>
              </div>
            );
          }}
        </SceneWrap>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // SCENE 7 — END CARD  (36.5 – 40s)
    // ═══════════════════════════════════════════════════════════════════════════════
    function Scene7_End() {
      return (
        <SceneWrap start={46.6} end={50} fade={0.3}>
          {(t) => {
            const logoP = ease(Math.min(1, t / 0.9));
            const glow = 0.28 + Math.sin(t * 1.1) * 0.05;
            return (
              <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
                {/* Glow */}
                <div style={{
                  position: 'absolute', width: 560, height: 480,
                  background: `radial-gradient(ellipse, oklch(0.72 0.16 175 / ${glow}) 0%, transparent 65%)`,
                  pointerEvents: 'none',
                }} />

                {/* Logo mark */}
                <div style={{
                  opacity: logoP, transform: `scale(${0.8 + logoP * 0.2})`,
                  display: 'flex', flexDirection: 'column', alignItems: 'center',
                  gap: 22, marginBottom: 60, willChange: 'opacity,transform',
                }}>
                  <img src="sittall-logo.png" style={{
                    width: 96, height: 96, borderRadius: 24,
                    boxShadow: `0 0 80px oklch(0.52 0.2 255 / 0.6)`,
                  }} />
                  <div style={{ fontFamily: MONO, fontSize: 48, fontWeight: 500, letterSpacing: '0.1em', textTransform: 'uppercase', color: TEXT }}>
                    SitTall - Fix Your Posture
                  </div>
                </div>

                {/* CTA button */}
                <Appear t={t} at={0.7} style={{ textAlign: 'center' }}>
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20 }}>
                    <div style={{
                      display: 'inline-flex', alignItems: 'center', gap: 14,
                      background: TEXT, color: BG,
                      borderRadius: 14, padding: '18px 40px',
                      fontFamily: SANS, fontSize: 20, fontWeight: 600,
                      letterSpacing: '-0.01em',
                      boxShadow: '0 8px 40px rgba(0,0,0,0.5)',
                    }}>
                      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                        <path d="M11 3v13M5 10l6 6 6-6" stroke={BG} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
                        <line x1="4" y1="19" x2="18" y2="19" stroke={BG} strokeWidth="2.2" strokeLinecap="round" />
                      </svg>
                      Download on Mac App Store
                    </div>
                    <div style={{ fontFamily: MONO, fontSize: 13, color: TEXT3, letterSpacing: '0.07em' }}>
                      Free · macOS 14+ · AirPods Pro 2 or AirPods 4 ANC
                    </div>
                  </div>
                </Appear>

                {/* Watermark */}
                <div style={{
                  position: 'absolute', bottom: 44,
                  fontFamily: MONO, fontSize: 13, color: TEXT3,
                  letterSpacing: '0.08em',
                  opacity: fadeIn(t, 1.6, 0.6),
                }}>
                  sittall.app
                </div>
              </div>
            );
          }}
        </SceneWrap>
      );
    }

    // ═══════════════════════════════════════════════════════════════════════════════
    // ROOT
    // ═══════════════════════════════════════════════════════════════════════════════
    function SitTallPromo() {
      const time = useTime();
      return (
        <div
          style={{ position: 'absolute', inset: 0, background: BG }}
          data-screen-label={`${Math.floor(time)}s`}
        >
          <GridBg />
          <Scene1_Hook />
          <Scene2_Drift />
          <Scene3_Reveal />
          <Scene4_Brand />
          <Scene5_Steps />
          <Scene6_Privacy />
          <Scene7_End />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <Stage
        width={1920}
        height={1080}
        duration={50}
        background={BG}
        persistKey="sittall-promo-v1"
        loop={false}
      >
        <SitTallPromo />
      </Stage>
    );
  </script>
</body>

</html>
